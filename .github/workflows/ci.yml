name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-22.04  # newer Ubuntu runners no longer have Python 3.9
            python: "3.9"     # oldest supported (e.g. Debian 11)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries (Linux; install.sh installs the same for users)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgl1 libegl1 libfontconfig1 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0 libxcb-image0
      - run: python -m pip install ".[test]"
      - name: Tests (database tests skip without a server)
        run: python -m pytest -q
        env:
          # Git for Windows ships its own gpg; skip GPG tests there rather than test that one.
          PM_SKIP_GPG_TESTS: ${{ runner.os == 'Windows' && '1' || '' }}

  integration:
    name: integration (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.4", "mariadb:11"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root || mariadb-admin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries (Linux; install.sh installs the same for users)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgl1 libegl1 libfontconfig1 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0 libxcb-image0
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
        env:
          PM_TEST_MYSQL: root:ci-root@127.0.0.1:3306

  binary:
    name: native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries (Linux; install.sh installs the same for users)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgl1 libegl1 libfontconfig1 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0 libxcb-image0
      - run: python -m pip install . "pyinstaller>=6.11"
      - run: python -m PyInstaller --noconfirm --clean --log-level WARN packaging/PasswordManager.spec
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Password Manager.app/Contents/MacOS/PasswordManager" --self-test'
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: dist/PasswordManager --self-test
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PasswordManager.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }

  uninstaller:
    name: uninstall.bat (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fake an install, uninstall it, then erase everything
        shell: pwsh
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'PasswordManager'
          $venv = Join-Path $appDir 'app\venv'
          New-Item -ItemType Directory -Force -Path $venv | Out-Null
          Set-Content (Join-Path $venv 'marker.txt') 'x'
          $links = @([Environment]::GetFolderPath('Programs'), [Environment]::GetFolderPath('Desktop')) |
            ForEach-Object { Join-Path $_ 'Password Manager.lnk' }
          foreach ($link in $links) { New-Item -ItemType Directory -Force -Path (Split-Path $link) | Out-Null; Set-Content $link 'x' }
          $cfg = Join-Path $env:APPDATA 'PasswordManager'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          Set-Content (Join-Path $cfg 'config.json') '{}'

          cmd /c "uninstall.bat /nopause"
          if ($LASTEXITCODE -ne 0) { throw "uninstall.bat exited with $LASTEXITCODE" }
          if (Test-Path $appDir) { throw 'the app folder is still there' }
          foreach ($link in $links) { if (Test-Path $link) { throw "shortcut left behind: $link" } }
          if (-not (Test-Path (Join-Path $cfg 'config.json'))) { throw 'settings were removed without /all' }

          'ERASE' | cmd /c "uninstall.bat /all /nopause"
          if ($LASTEXITCODE -ne 0) { throw "uninstall.bat /all exited with $LASTEXITCODE" }
          if (Test-Path $cfg) { throw 'settings are still there after /all' }

          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          'no' | cmd /c "uninstall.bat /all /nopause"
          if (-not (Test-Path $cfg)) { throw '/all erased settings without ERASE' }

  lint-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh install.command
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
