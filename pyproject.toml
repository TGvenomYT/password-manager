[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "password-manager-mark-iv"
dynamic = ["version"]
description = "Local password vault: Qt Quick GUI, MySQL storage, Fernet encryption, GPG-protected DB credential."
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42",
    "mysql-connector-python>=8.4,<10",
    "bcrypt>=4.1,<6",
    "PySide6-Essentials>=6.7",
    "certifi>=2023.7.22",
    "keyring>=24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.gui-scripts]
password-manager = "password_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["password_manager*"]

[tool.setuptools.dynamic]
version = { attr = "password_manager.__version__" }

[tool.setuptools.package-data]
"*" = ["*.png", "*.qml", "qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
